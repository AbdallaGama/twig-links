name: twig_links
description: "Universal Links, Android App Links, deferred deep linking and share links for Flutter, backed by your own free, self-hosted Twig server."
version: 0.1.0
homepage: https://github.com/AbdallaGama/Branchio-Clone-Github
repository: https://github.com/AbdallaGama/Branchio-Clone-Github/tree/main/sdk/flutter/twig_links
issue_tracker: https://github.com/AbdallaGama/Branchio-Clone-Github/issues
documentation: https://github.com/AbdallaGama/Branchio-Clone-Github/blob/main/docs/03-integration-guide.md
topics:
  - deep-linking
  - universal-links
  - app-links
  - dynamic-links
  - attribution

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.twig.twig_links
        pluginClass: TwigLinksPlugin
      ios:
        pluginClass: TwigLinksPlugin
