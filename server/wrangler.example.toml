# Twig on Cloudflare Workers. See docs/03-deployment.md.
#   cp wrangler.example.toml wrangler.toml
#   npx wrangler d1 create twig   → paste the database_id into wrangler.toml (both places)
#   npm run cf:deploy

name = "go"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# Dashboard + Web SDK. The Worker serves them itself (with security headers), so it runs first.
[assets]
directory = "dist-assets"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "twig"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# Every minute: webhook delivery (and an hourly purge of old click fingerprints).
[triggers]
crons = ["* * * * *"]

[vars]
CLICK_RETENTION_DAYS = "30"
MATCH_WINDOW_SECONDS = "7200"

# Same code and database under a second hostname (open.<subdomain>.workers.dev): the
# "alternate domain" that gives iOS Universal Links a second chance. Copy this block (with a new
# name) for every extra pair of link hostnames you want, e.g. one pair per customer app.
[env.alt]
name = "open"
workers_dev = true

[env.alt.assets]
directory = "dist-assets"
binding = "ASSETS"
run_worker_first = true

[[env.alt.d1_databases]]
binding = "DB"
database_name = "twig"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[env.alt.vars]
CLICK_RETENTION_DAYS = "30"
MATCH_WINDOW_SECONDS = "7200"
