# Twig on Cloudflare Workers (free plan). See docs/04-deployment.md.
#   npx wrangler d1 create twig   → paste the database_id below (both places)
#   npm run cf:deploy

name = "twig"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# Dashboard + Web SDK. The Worker serves them itself (with security headers), so it runs first.
[assets]
directory = "dist-assets"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "twig"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Every minute: webhook delivery (and an hourly purge of old click fingerprints).
[triggers]
crons = ["* * * * *"]

[vars]
CLICK_RETENTION_DAYS = "30"
MATCH_WINDOW_SECONDS = "7200"

# Same code and database under a second free hostname (twig-alt.<account>.workers.dev): the
# "alternate domain" that gives iOS Universal Links a second chance. Copy this block (with a new
# name) for every extra pair of link hostnames you want, e.g. one pair per customer app.
[env.alt]
name = "twig-alt"
workers_dev = true

[env.alt.assets]
directory = "dist-assets"
binding = "ASSETS"
run_worker_first = true

[[env.alt.d1_databases]]
binding = "DB"
database_name = "twig"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[env.alt.vars]
CLICK_RETENTION_DAYS = "30"
MATCH_WINDOW_SECONDS = "7200"
